<text x="40" y="51" class="kicker">LEVIATÃ / DOCUMENTAÇÃO / 01</text><text x="40" y="95" class="title">Uma plataforma, duas aplicações</text><text x="40" y="123" class="subtitle">A interface consulta a API; dados, mídias e envios têm responsabilidades distintas.</text><rect x="40" y="154" width="310" height="578" rx="16" fill="none" stroke="#e6dcc7"/><text x="60" y="183" class="group">NAVEGADOR</text><rect x="400" y="154" width="350" height="578" rx="16" fill="none" stroke="#e6dcc7"/><text x="420" y="183" class="group">API / NODE.JS</text><rect x="810" y="154" width="350" height="578" rx="16" fill="none" stroke="#e6dcc7"/><text x="830" y="183" class="group">DADOS E INTEGRAÇÕES</text><g><rect x="60" y="216" width="270" height="120" rx="12" fill="#fff" stroke="#d9c8a6"/><text x="78" y="246" class="node-title" style="fill:#26313e">Portal público</text><text x="78" y="271" class="node-copy" style="fill:#5c6672">React + Router + Axios</text><text x="78" y="291" class="node-copy" style="fill:#5c6672">Acervo, agenda, boletins</text><text x="78" y="311" class="node-copy" style="fill:#5c6672">Comentários e inscrição</text></g><g><rect x="60" y="407" width="270" height="125" rx="12" fill="#fff" stroke="#d9c8a6"/><text x="78" y="437" class="node-title" style="fill:#26313e">Painel administrativo</text><text x="78" y="462" class="node-copy" style="fill:#5c6672">Cadastros e vínculos</text><text x="78" y="482" class="node-copy" style="fill:#5c6672">Moderação e campanhas</text><text x="78" y="502" class="node-copy" style="fill:#5c6672">Sessão e permissões</text></g><g><rect x="425" y="216" width="300" height="195" rx="12" fill="#192330" stroke="#c6a15b"/><text x="443" y="246" class="node-title" style="fill:#efd6a1">NestJS + Express</text><text x="443" y="271" class="node-copy" style="fill:#e5e7eb">Controllers e DTOs</text><text x="443" y="291" class="node-copy" style="fill:#e5e7eb">Guards e regras nos serviços</text><text x="443" y="311" class="node-copy" style="fill:#e5e7eb">Repositórios + Prisma + pg</text><text x="443" y="331" class="node-copy" style="fill:#e5e7eb">Validação / OpenAPI</text></g><g><rect x="425" y="461" width="300" height="85" rx="12" fill="#fff" stroke="#d9c8a6"/><text x="443" y="491" class="node-title" style="fill:#26313e">Chrome / Puppeteer</text><text x="443" y="516" class="node-copy" style="fill:#5c6672">HTML da edição → PDF A4</text></g><g><rect x="425" y="606" width="300" height="85" rx="12" fill="#fff" stroke="#d9c8a6"/><text x="443" y="636" class="node-title" style="fill:#26313e">Worker de newsletters</text><text x="443" y="661" class="node-copy" style="fill:#5c6672">Fila persistida; execução contínua</text></g><g><rect x="835" y="216" width="300" height="115" rx="12" fill="#fff" stroke="#d9c8a6"/><text x="853" y="246" class="node-title" style="fill:#26313e">PostgreSQL</text><text x="853" y="271" class="node-copy" style="fill:#5c6672">Conteúdo, usuários e relações</text><text x="853" y="291" class="node-copy" style="fill:#5c6672">Fila, entregas e PDFs gerados</text></g><g><rect x="835" y="407" width="300" height="95" rx="12" fill="#fff" stroke="#d9c8a6"/><text x="853" y="437" class="node-title" style="fill:#26313e">Cloudinary</text><text x="853" y="462" class="node-copy" style="fill:#5c6672">Capas, galerias e PDFs enviados</text></g><g><rect x="835" y="606" width="300" height="85" rx="12" fill="#fff" stroke="#d9c8a6"/><text x="853" y="636" class="node-title" style="fill:#26313e">SMTP / Gmail</text><text x="853" y="661" class="node-copy" style="fill:#5c6672">HTML + texto + PDF em anexo</text></g><path d="M330 270H425" fill="none" stroke="#a47c36" stroke-width="1.5" marker-end="url(#arrow)"/><text x="345" y="250" class="label">HTTP / JSON</text><path d="M330 466H370V365H425" fill="none" stroke="#a47c36" stroke-width="1.5" marker-end="url(#arrow)"/><text x="340" y="550" class="label">JWT / multipart</text><path d="M725 270H835" fill="none" stroke="#a47c36" stroke-width="1.5" marker-end="url(#arrow)"/><text x="760" y="250" class="label">Prisma</text><path d="M725 365H785V451H835" fill="none" stroke="#a47c36" stroke-width="1.5" marker-end="url(#arrow)"/><text x="760" y="391" class="label">Upload</text><path d="M575 411V461" fill="none" stroke="#a47c36" stroke-width="1.5" marker-end="url(#arrow)"/><text x="590" y="442" class="label">Render</text><path d="M725 503H796V307H835" fill="none" stroke="#a47c36" stroke-width="1.5" marker-end="url(#arrow)"/><text x="805" y="366" class="label">PDF no banco</text><path d="M725 649H835" fill="none" stroke="#a47c36" stroke-width="1.5" marker-end="url(#arrow)"/><text x="752" y="630" class="label">Nodemailer</text><text x="40" y="776" class="subtitle">O frontend não recebe segredos de banco/SMTP/Cloudinary. Não há Redis nem handler serverless configurado no snapshot.</text></svg>