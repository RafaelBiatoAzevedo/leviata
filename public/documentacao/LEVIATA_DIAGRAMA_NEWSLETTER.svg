<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">Uma edição, duas saídas e um histórico de entrega</title><desc id="desc">Salvar gera HTML e PDF. Enviar exige uma ação explícita e cria uma cópia imutável da edição.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a47c36" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#26313e}.kicker{font-size:11px;letter-spacing:3px;fill:#936d2f}.title{font-family:Georgia,serif;font-size:30px}.subtitle{font-size:14px;fill:#5c6672}.node-title{font-size:17px;font-weight:600}.node-copy{font-size:13px;fill:#5c6672}.label{font-size:11px;fill:#805c25}.group{font-size:11px;letter-spacing:2px;fill:#6b7280}</style>
<rect width="1200" height="790" rx="18" fill="#fcfaf5"/><rect x="14" y="14" width="1172" height="762" rx="12" fill="none" stroke="#dac9a5"/>
<text x="40" y="51" class="kicker">LEVIATÃ / DOCUMENTAÇÃO / 03</text><text x="40" y="95" class="title">Uma edição, duas saídas e um histórico de entrega</text><text x="40" y="123" class="subtitle">Salvar gera HTML e PDF. Enviar exige uma ação explícita e cria uma cópia imutável da edição.</text><g><rect x="40" y="182" width="245" height="115" rx="12" fill="#fff" stroke="#d9c8a6"/><text x="58" y="212" class="node-title" style="fill:#26313e">01 / Editor visual</text><text x="58" y="237" class="node-copy" style="fill:#5c6672">Texto, imagens e seções</text><text x="58" y="257" class="node-copy" style="fill:#5c6672">Ou código HTML avançado</text></g><g><rect x="330" y="182" width="245" height="115" rx="12" fill="#192330" stroke="#c6a15b"/><text x="348" y="212" class="node-title" style="fill:#efd6a1">02 / API</text><text x="348" y="237" class="node-copy" style="fill:#e5e7eb">Renderiza HTML definitivo</text><text x="348" y="257" class="node-copy" style="fill:#e5e7eb">Resolve capa e valida conteúdo</text></g><g><rect x="620" y="182" width="245" height="115" rx="12" fill="#fff" stroke="#d9c8a6"/><text x="638" y="212" class="node-title" style="fill:#26313e">03 / Chrome</text><text x="638" y="237" class="node-copy" style="fill:#5c6672">Gera PDF A4 do mesmo HTML</text><text x="638" y="257" class="node-copy" style="fill:#5c6672">Falha impede a nova gravação</text></g><g><rect x="910" y="182" width="245" height="115" rx="12" fill="#fff" stroke="#d9c8a6"/><text x="928" y="212" class="node-title" style="fill:#26313e">04 / PostgreSQL</text><text x="928" y="237" class="node-copy" style="fill:#5c6672">HTML + PDF + hash + data</text><text x="928" y="257" class="node-copy" style="fill:#5c6672">Edição salva; ainda sem envio</text></g><path d="M285 239H330" fill="none" stroke="#a47c36" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M575 239H620" fill="none" stroke="#a47c36" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M865 239H910" fill="none" stroke="#a47c36" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect x="910" y="374" width="245" height="100" rx="12" fill="#fff" stroke="#d9c8a6"/><text x="928" y="404" class="node-title" style="fill:#26313e">Leitura e download</text><text x="928" y="429" class="node-copy" style="fill:#5c6672">Portal: edição publicada</text><text x="928" y="449" class="node-copy" style="fill:#5c6672">Admin: prévia e PDF</text></g><path d="M1032 297V374" fill="none" stroke="#a47c36" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect x="620" y="374" width="245" height="100" rx="12" fill="#fff" stroke="#d9c8a6"/><text x="638" y="404" class="node-title" style="fill:#26313e">05 / Campanha</text><text x="638" y="429" class="node-copy" style="fill:#5c6672">Cópia do HTML e do PDF</text><text x="638" y="449" class="node-copy" style="fill:#5c6672">Destinatários elegíveis</text></g><path d="M910 270H890V345H742V374" fill="none" stroke="#a47c36" stroke-width="1.5" marker-end="url(#arrow)"/><text x="753" y="332" class="label">Após confirmar envio</text><g><rect x="330" y="374" width="245" height="100" rx="12" fill="#fff" stroke="#d9c8a6"/><text x="348" y="404" class="node-title" style="fill:#26313e">06 / Worker</text><text x="348" y="429" class="node-copy" style="fill:#5c6672">Reconfere consentimento</text><text x="348" y="449" class="node-copy" style="fill:#5c6672">Controla cota e tentativas</text></g><path d="M620 424H575" fill="none" stroke="#a47c36" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect x="40" y="374" width="245" height="100" rx="12" fill="#fff" stroke="#d9c8a6"/><text x="58" y="404" class="node-title" style="fill:#26313e">07 / SMTP</text><text x="58" y="429" class="node-copy" style="fill:#5c6672">Corpo HTML + texto</text><text x="58" y="449" class="node-copy" style="fill:#5c6672">PDF anexo e descadastro</text></g><path d="M330 424H285" fill="none" stroke="#a47c36" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect x="40" y="574" width="245" height="105" rx="12" fill="#fff" stroke="#d9c8a6"/><text x="58" y="604" class="node-title" style="fill:#26313e">08 / Entrega aceita</text><text x="58" y="629" class="node-copy" style="fill:#5c6672">SENT + NewsletterDelivery</text><text x="58" y="649" class="node-copy" style="fill:#5c6672">Não é confirmação de leitura</text></g><path d="M162 474V574" fill="none" stroke="#a47c36" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect x="330" y="574" width="245" height="105" rx="12" fill="#fff" stroke="#d9c8a6"/><text x="348" y="604" class="node-title" style="fill:#26313e">Inscritos e preferências</text><text x="348" y="629" class="node-copy" style="fill:#5c6672">Ativo e allowEmail=true</text><text x="348" y="649" class="node-copy" style="fill:#5c6672">Descadastro desativa e-mail</text></g><path d="M452 574V474" fill="none" stroke="#a47c36" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect x="620" y="574" width="245" height="105" rx="12" fill="#fff" stroke="#d9c8a6"/><text x="638" y="604" class="node-title" style="fill:#26313e">Falhas e incertezas</text><text x="638" y="629" class="node-copy" style="fill:#5c6672">FAILED pode ser reavaliado</text><text x="638" y="649" class="node-copy" style="fill:#5c6672">UNKNOWN: conferir, não repetir</text></g><path d="M575 450H595V625H620" fill="none" stroke="#a47c36" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="743" class="subtitle">A fila usa PostgreSQL. SMTP não garante entrega exatamente uma vez quando a conexão cai após a aceitação.</text></svg>