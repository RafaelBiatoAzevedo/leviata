<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Uma contribuição só aparece depois da revisão</title><desc id="desc">A criação é pública; a decisão de aprovação ou recusa exige SUPER_ADMIN.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a47c36" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#26313e}.kicker{font-size:11px;letter-spacing:3px;fill:#936d2f}.title{font-family:Georgia,serif;font-size:30px}.subtitle{font-size:14px;fill:#5c6672}.node-title{font-size:17px;font-weight:600}.node-copy{font-size:13px;fill:#5c6672}.label{font-size:11px;fill:#805c25}.group{font-size:11px;letter-spacing:2px;fill:#6b7280}</style>
<rect width="1200" height="690" rx="18" fill="#fcfaf5"/><rect x="14" y="14" width="1172" height="662" rx="12" fill="none" stroke="#dac9a5"/>
<text x="40" y="51" class="kicker">LEVIATÃ / DOCUMENTAÇÃO / 02</text><text x="40" y="95" class="title">Uma contribuição só aparece depois da revisão</text><text x="40" y="123" class="subtitle">A criação é pública; a decisão de aprovação ou recusa exige SUPER_ADMIN.</text><g><rect x="40" y="184" width="245" height="115" rx="12" fill="#fff" stroke="#d9c8a6"/><text x="58" y="214" class="node-title" style="fill:#26313e">01 / Visitante</text><text x="58" y="239" class="node-copy" style="fill:#5c6672">Nome completo e texto curto</text><text x="58" y="259" class="node-copy" style="fill:#5c6672">Alvo identificado por UUID</text></g><g><rect x="330" y="184" width="245" height="115" rx="12" fill="#fff" stroke="#d9c8a6"/><text x="348" y="214" class="node-title" style="fill:#26313e">02 / API + banco</text><text x="348" y="239" class="node-copy" style="fill:#5c6672">Valida alvo, texto e limite</text><text x="348" y="259" class="node-copy" style="fill:#5c6672">PENDING + notificação juntos</text></g><g><rect x="620" y="184" width="245" height="115" rx="12" fill="#fff" stroke="#d9c8a6"/><text x="638" y="214" class="node-title" style="fill:#26313e">03 / Administração</text><text x="638" y="239" class="node-copy" style="fill:#5c6672">Sino e central de notificações</text><text x="638" y="259" class="node-copy" style="fill:#5c6672">Ler não significa aprovar</text></g><g><rect x="910" y="184" width="245" height="115" rx="12" fill="#192330" stroke="#c6a15b"/><text x="928" y="214" class="node-title" style="fill:#efd6a1">04 / Superadmin</text><text x="928" y="239" class="node-copy" style="fill:#e5e7eb">Confere a contribuição</text><text x="928" y="259" class="node-copy" style="fill:#e5e7eb">Escolhe aprovar ou recusar</text></g><path d="M285 241H330" fill="none" stroke="#a47c36" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M575 241H620" fill="none" stroke="#a47c36" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M865 241H910" fill="none" stroke="#a47c36" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect x="620" y="391" width="245" height="105" rx="12" fill="#fff" stroke="#d9c8a6"/><text x="638" y="421" class="node-title" style="fill:#26313e">Aprovar</text><text x="638" y="446" class="node-copy" style="fill:#5c6672">Registra responsável e data</text><text x="638" y="466" class="node-copy" style="fill:#5c6672">Status APPROVED</text></g><g><rect x="910" y="391" width="245" height="105" rx="12" fill="#fff" stroke="#d9c8a6"/><text x="928" y="421" class="node-title" style="fill:#26313e">Recusar</text><text x="928" y="446" class="node-copy" style="fill:#5c6672">Apaga o comentário</text><text x="928" y="466" class="node-copy" style="fill:#5c6672">Preserva resultado no aviso</text></g><path d="M1032 299V348H742V391" fill="none" stroke="#a47c36" stroke-width="1.5" marker-end="url(#arrow)"/><text x="790" y="333" class="label">Decisão</text><path d="M1032 348V391" fill="none" stroke="#a47c36" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect x="620" y="552" width="245" height="80" rx="12" fill="#fff" stroke="#d9c8a6"/><text x="638" y="582" class="node-title" style="fill:#26313e">Portal</text><text x="638" y="607" class="node-copy" style="fill:#5c6672">Carrossel do conteúdo correto</text></g><g><rect x="910" y="552" width="245" height="80" rx="12" fill="#fff" stroke="#d9c8a6"/><text x="928" y="582" class="node-title" style="fill:#26313e">Sem publicação</text><text x="928" y="607" class="node-copy" style="fill:#5c6672">Nome/texto recusados removidos</text></g><path d="M742 496V552" fill="none" stroke="#a47c36" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1032 496V552" fill="none" stroke="#a47c36" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="365" class="label">O portal lê somente APPROVED.</text><text x="40" y="389" class="subtitle">1 cartão em telas menores; 2 a partir de 600 px;</text><text x="40" y="413" class="subtitle">3 a partir de 900 px de espaço disponível.</text><text x="40" y="655" class="subtitle">Não há estado REJECTED persistido no comentário. A contribuição só é pública após aprovação.</text></svg>